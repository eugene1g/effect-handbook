name: Scheduled handbook audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: External HTTP links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install pinned pnpm through npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Check documentation links
        run: pnpm docs:links

  latest-v4:
    name: Latest Effect v4 and public surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install pinned pnpm through npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Resolve latest v4, clone its tag, and audit public coverage
        run: pnpm docs:release:check
