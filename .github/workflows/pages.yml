name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    outputs:
      base: ${{ steps.base.outputs.base }}
      site_url: ${{ steps.site.outputs.site_url }}
    steps:
      - name: Read Pages metadata
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Resolve site base path
        id: base
        shell: bash
        env:
          CONFIGURED_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PR_BASE_OVERRIDE: ${{ vars.VITEPRESS_BASE }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            raw="$CONFIGURED_BASE_PATH"
          elif [[ -n "$PR_BASE_OVERRIDE" ]]; then
            raw="$PR_BASE_OVERRIDE"
          else
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            repo="${GITHUB_REPOSITORY#*/}"
            if [[ "${repo,,}" == "${owner}.github.io" ]]; then
              raw="/"
            else
              raw="/${repo}/"
            fi
          fi

          if [[ -z "$raw" || "$raw" == "/" ]]; then
            base="/"
          else
            base="/${raw#/}"
            base="${base%/}/"
          fi

          [[ "$base" == /* && "$base" == */ ]]
          [[ "$base" != *".."* && "$base" != *"//"* ]]
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Resolve public site URL
        id: site
        shell: bash
        env:
          CONFIGURED_BASE_URL: ${{ steps.pages.outputs.base_url }}
          RESOLVED_BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          site_url="$CONFIGURED_BASE_URL"
          if [[ -z "$site_url" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            site_url="https://handbook.invalid${RESOLVED_BASE}"
          fi
          if [[ -n "$site_url" ]]; then
            site_url="${site_url%/}/"
          fi
          printf 'site_url=%s\n' "$site_url" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Skill and root unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@26
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the refresh skill
        run: pnpm docs:skill:unit

      - name: Check native Node TypeScript tooling
        run: pnpm docs:tools:check

      - name: Test handbook tooling
        run: pnpm docs:unit

  markdown:
    name: Canonical Markdown and retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@26
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical Markdown and retrieval decisions
        run: pnpm docs:markdown

      - name: Check whitespace
        run: git diff --check

  examples:
    name: TypeScript, Effect, doctest, and runtime examples
    needs: [unit-tests, markdown]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@26
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract and validate every documentation example
        run: pnpm docs:examples

  build:
    name: Site and artifacts (${{ matrix.mode }})
    needs: [metadata, unit-tests, markdown]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [root, pages]
    env:
      VITEPRESS_BASE: ${{ matrix.mode == 'root' && '/' || needs.metadata.outputs.base }}
      HANDBOOK_SITE_URL: ${{ matrix.mode == 'pages' && needs.metadata.outputs.site_url || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@26
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress and generated artifacts
        run: pnpm docs:build

      - name: Verify artifact parity and crawl static links
        run: pnpm docs:verify -- --base "$VITEPRESS_BASE"

      - name: Smoke-test HTTP and file URLs in Chrome
        run: pnpm docs:smoke -- --base "$VITEPRESS_BASE"

      - name: Confirm the build changed no tracked source
        run: git diff --exit-code

      - name: Upload Pages artifact
        if: matrix.mode == 'pages' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [metadata, unit-tests, markdown, examples, build]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
